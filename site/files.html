<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f5f5f4">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121214">
<link rel="icon" type="image/png" href="icon-192.png">
<title>My files</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--low:#b3261e;--bg:#f5f5f4;--card:#fff;--ink:#1a1a1c;--mute:#5e5e63;--line:#dddcd9;--accent:#0e6b57;--on-accent:#fff;--drop:#e3f1ec}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--low:#ff8a80;--bg:#121214;--card:#1c1c1f;--ink:#ececee;--mute:#a3a3a8;--line:#2f2f33;--accent:#52c7a8;--on-accent:#05221a;--drop:#1d3a31;color-scheme:dark}}
:root[data-theme="dark"]{--low:#ff8a80;--bg:#121214;--card:#1c1c1f;--ink:#ececee;--mute:#a3a3a8;--line:#2f2f33;--accent:#52c7a8;--on-accent:#05221a;--drop:#1d3a31;color-scheme:dark}
*,*::before,*::after{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;font-size:1rem;line-height:1.4}
main{max-width:40rem;margin:0 auto;padding:1.25rem 1rem calc(2.5rem + env(safe-area-inset-bottom,0px))}
h1{font-size:1.5rem;margin:0 0 .2rem}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;flex-wrap:wrap;margin:0 0 .8rem}
.sub{color:var(--mute);margin:0;font-size:.95rem}
.btn{font:inherit;font-size:.9rem;color:var(--ink);background:transparent;border:2px solid var(--line);border-radius:.5rem;padding:.45rem .8rem;min-height:2.5rem;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:.3rem}
.btn:hover{border-color:var(--mute)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700}
.btn.small{min-height:2rem;padding:.15rem .55rem;font-size:.82rem}
.btn.danger{color:var(--low)}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.pseg{display:flex;gap:.35rem;flex-wrap:wrap;margin:0 0 1rem}
.pseg .btn{border-radius:1.2rem;border-width:1px;min-height:2.3rem}
.pseg .btn[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.intro{color:var(--mute);font-size:.9rem;margin:0 0 1rem}
.cat{background:var(--card);border:1px solid var(--line);border-radius:.8rem;padding:.9rem 1rem;margin:0 0 .8rem;transition:background .15s}
.cat.over{background:var(--drop);border-color:var(--accent)}
.cat-head{display:flex;justify-content:space-between;align-items:flex-start;gap:.75rem}
.cat-head h2{font-size:1.05rem;margin:0}
.cat-head h2 small{font-weight:400;color:var(--mute);font-size:.82rem;margin-left:.3rem}
.hint{color:var(--mute);font-size:.85rem;margin:.2rem 0 0}
.where{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.75rem;color:var(--mute);margin:.35rem 0 0;overflow-wrap:anywhere}
.files{list-style:none;margin:.7rem 0 0;padding:0;border-top:1px solid var(--line)}
.files li{display:flex;align-items:center;gap:.6rem;padding:.5rem 0;border-bottom:1px solid var(--line)}
.files li:last-child{border-bottom:0}
.files .nm{flex:1;min-width:0}
.files a{color:var(--ink);text-decoration:none;font-weight:700;overflow-wrap:anywhere}
.files a:hover{text-decoration:underline}
.files .meta{display:block;color:var(--mute);font-size:.8rem;font-variant-numeric:tabular-nums}
.empty{color:var(--mute);font-size:.88rem;margin:.6rem 0 0}
.prog{margin:.6rem 0 0;font-size:.85rem}
.prog .bar{height:.4rem;background:var(--line);border-radius:1rem;overflow:hidden;margin-top:.25rem}
.prog .bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
.msg{border-radius:.6rem;padding:.6rem .8rem;margin:.6rem 0 0;font-size:.9rem}
.msg.err{background:color-mix(in srgb,var(--low) 14%,var(--card));border:1px solid var(--low)}
.msg.ok{background:color-mix(in srgb,var(--accent) 14%,var(--card));border:1px solid var(--accent)}
.privacy{color:var(--mute);font-size:.85rem;margin:1.2rem 0 0}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
[hidden]{display:none!important}
</style>
<script src="regions.js"></script>
<script src="appearance.js"></script>
</head>
<body>
<main>
  <div class="top">
    <div><h1>My files</h1><p class="sub" id="sub">Loading…</p></div>
    <a class="btn" href="./">← Back to the app</a>
  </div>
  <div id="pmsg"></div>
  <div id="app" hidden>
    <div class="pseg" id="people" hidden role="group" aria-label="Whose files"></div>
    <p class="intro">Upload anything that helps with the meal and exercise plan. Each kind of file has its own folder. Tap <b>Upload</b>, or drag files onto a box.</p>
    <div id="cats"></div>
    <p class="privacy" id="privacy"></p>
  </div>
</main>
<script>
// The "My files" page. It asks the server (api/uploads.js) for this person's files,
// shows one box per kind of file, and uploads new files with a progress bar.
"use strict";
var ME = null;      // who is logged in: {user, person, admin}
var PERSON = null;  // whose files are shown (admins can switch)
var DATA = null;    // the last answer from the server: {person, people, categories}
var BUSY = 0;       // how many uploads are running right now

// Shortcut for document.getElementById.
function $(id) {
  return document.getElementById(id);
}

// Makes a new element, with an optional class name and text: el("p", "hint", "Hello").
function el(tag, cls, txt) {
  var e = document.createElement(tag);
  if (cls) e.className = cls;
  if (txt != null) e.textContent = txt;
  return e;
}

// Capital first letter: "alex" becomes "Alex".
function cap(s) {
  return s.charAt(0).toUpperCase() + s.slice(1);
}

// A file size people can read: 2048 becomes "2 KB".
function size(bytes) {
  var KB = 1024, MB = 1048576, GB = 1073741824;
  if (bytes < KB) return bytes + " B";
  if (bytes < MB) return Math.round(bytes / KB) + " KB";
  if (bytes < GB) return (bytes / MB).toFixed(bytes < 10 * MB ? 1 : 0) + " MB";   // one decimal place under 10 MB
  return (bytes / GB).toFixed(2) + " GB";
}

// A date and time people can read, such as "8 Nov 2026, 2:15 pm".
function when(ms) {
  return new Date(ms).toLocaleString(Appearance.locale(), { day: "numeric", month: "short", year: "numeric", hour: "numeric", minute: "2-digit" });
}

// Builds the "?a=1&b=2" part of an address, safely encoding each value.
function q(params) {
  return Object.keys(params).map(function (key) {
    return encodeURIComponent(key) + "=" + encodeURIComponent(params[key]);
  }).join("&");
}

// Calls the server and returns its JSON answer. If the server says no, it throws an error with
// the server's message. The X-Requested-With header proves the request came from this page.
function api(method, url) {
  return fetch(url, { method: method, cache: "no-store", headers: { "X-Requested-With": "files" } }).then(function (response) {
    return response.json().catch(function () { return {}; }).then(function (data) {
      if (!response.ok) throw new Error(data.error || ("Request failed (" + response.status + ")"));
      return data;
    });
  });
}

// Fetches the current person's file list and redraws the page.
function load() {
  return api("GET", "/api/uploads?" + q({ person: PERSON })).then(function (data) {
    DATA = data;
    PERSON = data.person;
    render();
  });
}

// Draws the whole page from DATA: the person picker (admins only), then one box per kind of file.
function render() {
  $("sub").textContent = (PERSON === ME.person ? "Your" : cap(PERSON) + "’s") + " uploads";

  // Person picker. Only shown when there is more than one person to pick from.
  var picker = $("people");
  picker.textContent = "";
  picker.hidden = DATA.people.length < 2;
  DATA.people.forEach(function (person) {
    var button = el("button", "btn", cap(person) + (person === ME.person ? " (me)" : ""));
    button.type = "button";
    button.setAttribute("aria-pressed", person === PERSON);
    button.onclick = function () {
      if (BUSY) {
        alert("Wait for the upload to finish first.");
        return;
      }
      PERSON = person;
      load();
    };
    picker.appendChild(button);
  });

  var boxes = $("cats");
  boxes.textContent = "";
  DATA.categories.forEach(function (category) {
    boxes.appendChild(catCard(category));
  });

  $("privacy").textContent = ME.admin
    ? "Each person can only see their own files. As an admin you can see everyone’s."
    : "Only you and the plan’s admin can see these files.";
}

// Makes the box for one kind of file (such as "Blood tests"): a heading, an Upload button,
// drag and drop, and the list of files with Download and Delete buttons.
function catCard(c) {
  var card = el("section", "cat");
  card.setAttribute("aria-labelledby", "h-" + c.id);

  // Heading, hint and folder name.
  var head = el("div", "cat-head");
  var text = el("div");
  var heading = el("h2");
  heading.id = "h-" + c.id;
  heading.textContent = c.label;
  var count = c.files.length ? c.files.length + (c.files.length === 1 ? " file" : " files") : "";
  heading.appendChild(el("small", null, count));
  text.appendChild(heading);
  text.appendChild(el("p", "hint", c.hint));
  text.appendChild(el("p", "where", "Saved in uploads/" + PERSON + "/" + c.id + "/"));
  head.appendChild(text);

  // The Upload button is a <label> for a hidden file picker, so tapping it opens the picker.
  var input = el("input");
  input.type = "file";
  input.multiple = true;
  input.accept = c.accept;
  input.id = "f-" + c.id;
  input.setAttribute("aria-label", "Upload to " + c.label);
  var uploadButton = el("label", "btn primary small", "Upload");
  uploadButton.htmlFor = input.id;
  uploadButton.setAttribute("role", "button");
  uploadButton.tabIndex = 0;
  // Let keyboard users press Enter or Space on it, like a real button.
  uploadButton.onkeydown = function (e) {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      input.click();
    }
  };
  head.appendChild(uploadButton);
  card.appendChild(head);
  card.appendChild(input);

  var status = el("div");   // progress bars and messages go here
  card.appendChild(status);
  input.onchange = function () {
    var picked = [].slice.call(input.files);   // copy the list before clearing the picker
    input.value = "";
    uploadAll(c, picked, status);
  };

  // Drag and drop onto the box.
  card.addEventListener("dragover", function (e) {
    e.preventDefault();
    card.classList.add("over");
  });
  card.addEventListener("dragleave", function (e) {
    if (!card.contains(e.relatedTarget)) card.classList.remove("over");
  });
  card.addEventListener("drop", function (e) {
    e.preventDefault();
    card.classList.remove("over");
    uploadAll(c, [].slice.call(e.dataTransfer.files || []), status);
  });

  if (!c.files.length) {
    card.appendChild(el("p", "empty", "Nothing here yet."));
    return card;
  }

  var list = el("ul", "files");
  c.files.forEach(function (f) {
    list.appendChild(fileRow(c, f));
  });
  card.appendChild(list);
  return card;
}

// One line in a file list: the name (opens it), its size and date, Download, and Delete.
function fileRow(c, f) {
  var row = el("li");
  var fileUrl = "/api/uploads/file?" + q({ person: PERSON, category: c.id, name: f.name });

  var nameBox = el("div", "nm");
  var link = el("a", null, f.name);
  link.href = fileUrl;
  link.target = "_blank";
  link.rel = "noopener";
  nameBox.appendChild(link);
  nameBox.appendChild(el("span", "meta", size(f.size) + " · added " + when(f.at)));
  row.appendChild(nameBox);

  var download = el("a", "btn small", "Download");
  download.href = fileUrl + "&download=1";
  download.setAttribute("aria-label", "Download " + f.name);
  row.appendChild(download);

  var del = el("button", "btn small danger", "Delete");
  del.type = "button";
  del.setAttribute("aria-label", "Delete " + f.name);
  del.onclick = function () {
    if (!confirm("Delete “" + f.name + "”? This can’t be undone.")) return;
    del.disabled = true;
    api("DELETE", fileUrl).then(load).catch(function (e) {
      del.disabled = false;
      alert("Could not delete it: " + e.message);
    });
  };
  row.appendChild(del);
  return row;
}

// The file type of a name, with its dot, in lower case: "Scan.JPG" gives ".jpg".
function dotExt(name) {
  return (name.match(/\.[^.]+$/) || [""])[0].toLowerCase();
}

// Uploads files one at a time with a progress bar (big Apple Health exports can take a while).
// Files of the wrong type for this box are skipped, with a message saying so.
function uploadAll(c, files, status) {
  if (!files.length) return;
  var allowed = c.accept.split(",");   // like [".pdf", ".jpg"]
  var wrongType = files.filter(function (f) {
    return allowed.indexOf(dotExt(f.name)) < 0;
  });
  status.textContent = "";
  if (wrongType.length) {
    var names = wrongType.map(function (f) { return f.name; }).join(", ");
    var message = c.label + " takes " + allowed.join(", ") + " files, so " + names + (wrongType.length === 1 ? " was" : " were") + " skipped.";
    status.appendChild(el("div", "msg err", message));
  }
  files = files.filter(function (f) {
    return wrongType.indexOf(f) < 0;
  });
  if (!files.length) return;

  // The progress bar: a label, and a bar whose inner <i> grows from 0% to 100%.
  var progress = el("div", "prog");
  var label = el("div");
  var bar = el("div", "bar");
  var fill = el("i");
  bar.appendChild(fill);
  progress.appendChild(label);
  progress.appendChild(bar);
  status.appendChild(progress);

  var index = 0;      // which file is next
  var uploaded = [];  // names of the files that worked
  BUSY++;

  // Called when every file has been tried: refresh the list and say how many worked.
  function finished() {
    BUSY--;
    progress.remove();
    load().then(function () {
      var position = DATA.categories.map(function (x) { return x.id; }).indexOf(c.id);
      var box = $("cats").querySelectorAll(".cat")[position];   // the redrawn box for this kind
      if (!box || !uploaded.length) return;
      var done = el("div", "msg ok", "Uploaded " + uploaded.length + (uploaded.length === 1 ? " file." : " files."));
      box.insertBefore(done, box.querySelector(".files,.empty"));
      setTimeout(function () { done.remove(); }, 4000);
    });
  }

  // Shows an error for one file, above the progress bar.
  function showError(text) {
    status.insertBefore(el("div", "msg err", text), progress);
  }

  // Uploads the next file, then calls itself again when that one is done.
  function next() {
    if (index >= files.length) {
      finished();
      return;
    }
    var f = files[index++];
    label.textContent = "Uploading " + f.name + " (" + size(f.size) + ")" + (files.length > 1 ? " · " + index + " of " + files.length : "");
    fill.style.width = "0";

    // XMLHttpRequest is used instead of fetch() because it can report upload progress.
    var request = new XMLHttpRequest();
    request.open("POST", "/api/uploads?" + q({ person: PERSON, category: c.id, name: f.name }));
    request.setRequestHeader("X-Requested-With", "files");
    request.setRequestHeader("Content-Type", "application/octet-stream");
    request.upload.onprogress = function (e) {
      if (e.lengthComputable) fill.style.width = Math.round(e.loaded / e.total * 100) + "%";
    };
    request.onload = function () {
      var answer = {};
      try { answer = JSON.parse(request.responseText); } catch (e) {}
      if (request.status === 200) uploaded.push(answer.name);
      else showError(f.name + ": " + (answer.error || "upload failed (" + request.status + ")"));
      next();
    };
    request.onerror = function () {
      showError(f.name + ": the upload failed. Check your connection and try again.");
      next();
    };
    request.send(f);
  }
  next();
}

// Warn before leaving the page while an upload is still running.
window.addEventListener("beforeunload", function (e) {
  if (BUSY) {
    e.preventDefault();
    e.returnValue = "";
  }
});

// Start: find out who is logged in, then load their files.
fetch("/auth/me", { cache: "no-store" }).then(function (response) {
  return response.ok ? response.json() : null;
}).then(function (me) {
  if (!me) {
    location.href = "/login?next=%2Ffiles.html";
    return;
  }
  ME = me;
  PERSON = me.person;
  return load().then(function () { $("app").hidden = false; });
}).catch(function (e) {
  $("sub").textContent = "";
  $("pmsg").appendChild(el("div", "msg err", "Could not load your files: " + e.message));
});
</script>
</body>
</html>
