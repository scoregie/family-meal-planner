# Runs the automated tests (tests/) on GitHub for every pull request and every change to main,
# so a pull request shows a green tick or a red cross before it's merged.
name: Tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --disable-warning=ExperimentalWarning --test --test-reporter=spec "tests/*.test.js"
